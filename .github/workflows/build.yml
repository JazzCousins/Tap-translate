name: Build Android app

# Runs by itself whenever files are added or changed in the repository,
# and you can also start it by hand from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      # Works whether the files were uploaded at the top level or inside a TapTranslate folder.
      - name: Find the project folder
        id: find
        run: |
          settings=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$settings" ]; then
            echo "Could not find settings.gradle.kts. Did every file get uploaded?" >&2
            exit 1
          fi
          dir=$(dirname "$settings")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # The build machine has several Java versions installed. Android needs 17.
      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            echo "sdkmanager not found, continuing anyway"
          fi

      - name: Build the app
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Looks inside the finished app file and prints what it finds. Never stops the build.
      - name: Check the app file is valid
        continue-on-error: true
        run: |
          APK="${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk"
          echo "== file =="
          ls -l "$APK"
          sha256sum "$APK"
          echo "== zip test =="
          unzip -tq "$APK" || echo "ZIP TEST FAILED"
          BT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -n 1)"
          echo "== signature check (build-tools: $BT) =="
          "$BT/apksigner" verify --verbose "$APK" || echo "SIGNATURE CHECK REPORTED A PROBLEM"
          echo "== app details =="
          "$BT/aapt2" dump badging "$APK" | head -n 12 || echo "COULD NOT READ APP DETAILS"

      # Copy 1: the plain .apk file, downloaded directly.
      - name: Save the app file (plain .apk)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

      # Copy 2: the same file inside a normal .zip (the long-established way). Unzip it on the phone.
      - name: Save the app file (inside a zip)
        uses: actions/upload-artifact@v7
        with:
          name: TapTranslate-app-zip
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
